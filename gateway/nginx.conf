# Gateway / reverse proxy.
# Clave del ejemplo: legacy y migración viven bajo el MISMO origen (localhost:8080),
# por lo que la cookie SHARED_SESSION (Path=/) viaja a ambos sistemas.

server {
    listen 80;

    # Redirecciones relativas: evita que nginx las convierta a http://localhost:80/...
    absolute_redirect off;

    # DNS interno de Docker: los upstream se resuelven en cada request, así el
    # gateway arranca aunque algún servicio todavía no esté disponible.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $legacy http://legacy:8080;
    set $api    http://api:3000;
    set $web    http://web:80;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 302 /legacy/login.do;
    }

    # Sistema legacy (Struts 1.2 en Tomcat)
    location /legacy/ {
        proxy_pass $legacy;
    }

    # Backend nuevo (NestJS)
    location /api/ {
        proxy_pass $api;
    }

    # Frontend nuevo (Angular)
    location = /nuevo {
        return 301 /nuevo/;
    }
    location /nuevo/ {
        proxy_pass $web;
    }
}
